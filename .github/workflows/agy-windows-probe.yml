name: agy-windows-probe
on:
  push:
    branches: [agy-windows-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Run agy suite (mirror reviewer command + wrap)
        shell: bash
        run: |
          set +e
          uv run --extra proxy --with pytest --with pytest-asyncio python -m pytest \
            tests/test_agy_ca.py tests/test_agy_dispatch.py tests/test_agy_terminator.py \
            tests/test_agy_retrieve.py tests/test_agy_stats.py tests/test_agy_registrar.py \
            tests/test_proxy_google_cloudcode_route_aliases.py tests/test_wrap_agy.py -rA --tb=short 2>&1 | tee agy_win.log
          echo "PYTEST_EXIT=${PIPESTATUS[0]}"
      - name: Failure summary
        if: always()
        shell: bash
        run: grep -E "passed|failed|^FAILED" agy_win.log | tail -20
      - name: WU-P evidence - Windows leaf-key temp ACL
        if: always()
        shell: bash
        run: |
          python - <<'PYEOF'
          import tempfile, os, subprocess
          fd, p = tempfile.mkstemp(prefix="hr_leaf_", suffix=".pem")
          os.write(fd, b"leafkey"); os.close(fd)
          print("WUP_TEMP_PATH=" + p)
          print("WUP_WHOAMI=" + subprocess.run(["whoami"], capture_output=True, text=True).stdout.strip())
          r = subprocess.run(["icacls", p], capture_output=True, text=True)
          print("WUP_ICACLS_FILE:\n" + r.stdout)
          rd = subprocess.run(["icacls", os.path.dirname(p)], capture_output=True, text=True)
          print("WUP_ICACLS_DIR:\n" + rd.stdout)
          os.unlink(p)
          PYEOF
